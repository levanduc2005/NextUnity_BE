spring.application.name=NextUnity
server.port=${PORT:8000}
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.jackson.deserialization.fail-on-unknown-properties=true

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nextunity_db}?sslmode=${POSTGRES_SSL_MODE:prefer}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}

# =========================
# SEED DATA
# =========================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=\
classpath:sql/01_users.sql,\
classpath:sql/02_communities.sql,\
classpath:sql/03_courses.sql,\
classpath:sql/04_modules.sql,\
classpath:sql/05_lessons.sql,\
classpath:sql/06_flashcards.sql,\
classpath:sql/07_mindmaps.sql,\
classpath:sql/08_slides.sql,\
classpath:sql/09_enrollments.sql,\
classpath:sql/10_quizzes.sql

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# REDIS
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# MAIL
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# JWT
# =========================
jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# =========================
# LOGGING
# =========================
logging.level.org.springframework.security=DEBUG

# =========================
# OTP TIMEOUTS
# =========================
otp.expiration.minute=5

frontend.url=http://localhost:3000

# =========================
# PAYOS CONFIGURATION
# =========================
payos.client-id=${PAYOS_CLIENT_ID:dummy_client_id}
payos.api-key=${PAYOS_API_KEY:dummy_api_key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:dummy_checksum_key}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:3000/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}