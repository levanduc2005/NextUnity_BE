server {
    listen 80;
    server_name localhost;

    # Tăng giới hạn kích thước upload cho tài liệu Slide/PDF (mặc định của Nginx chỉ 1MB)
    client_max_body_size 50M;

    # Chuyển tiếp toàn bộ request về Spring Boot Backend (chạy ở port 8000 trên máy host)
    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ HTTP/1.1 và WebSocket (nếu có dùng thông báo realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout cho các tác vụ AI phân tích file hoặc upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
