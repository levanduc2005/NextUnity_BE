name: NextUnity Backend CD (Docker Hub)

on: 
  workflow_run:
    workflows: [ "NextUnity Backend CI & SonarCloud" ]
    types: 
      - completed
    branches: [ "main" ]

  workflow_dispatch: 

concurrency: 
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@369eb991f42913e54162a03461dc70b8897332c7 # v5.5.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nextunity-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@4f58ea7960e2387e356433f14e12f94677708f40 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

